# The on-demand author-self-reference modes (review / address) — the
# CONVERSATION half of the bot. Secrets/vars come from the stump.wtf org
# (AIBOT_ZAI_*, AIBOT_BOT_LOGIN). The bot reviews and comments; it never
# merges.
#
# `pull_request` is deliberately NOT a trigger here. Opening or pushing to a PR
# is reviewed by the `review` job in pipeline.yaml, which sits behind
# `needs: [build]`; as its own workflow this one fired the instant a PR opened
# and spent tokens reviewing code that had not been shown to compile. Keeping
# both triggers would double-review every push, so the split is by EVENT: the
# pipeline owns PR pushes, this file owns the replies to them.
name: aibot

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  aibot:
    runs-on: ubuntu-latest
    if: >
      (github.event_name == 'issue_comment'
        && github.event.issue.pull_request != null
        && github.event.comment.user.login == github.event.issue.user.login)
      ||
      (github.event_name == 'pull_request_review_comment'
        && github.event.sender.login == github.event.pull_request.user.login)
      ||
      (github.event_name == 'pull_request_review'
        && github.event.sender.login == github.event.pull_request.user.login)
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          # Check out the head SHA, not the branch ref. A merge can delete the
          # head branch while this job is queued; the SHA survives the deletion,
          # the ref does not, so a ref checkout dies with "could not be found"
          # and, where aibot is a required check, leaves the merged PR red.
          ref: ${{ github.event.pull_request.head.sha }}
          # The head branch lives in the head REPO, which is not this repo when the
          # PR comes from a fork. Without `repository:` the checkout resolves the
          # branch name against the base repo, does not find it, and the job dies in
          # ~6s. Required by gitea-aibot-action since 2026-07-25; this workflow was
          # copied from the example before that and had drifted.
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          fetch-depth: 0

      - name: AI bot
        uses: https://gitea.stump.rocks/stumpcloud/gitea-aibot-action@main
        env:
          AIBOT_HARNESS: ${{ vars.AIBOT_HARNESS || 'crush' }}
          AIBOT_MODEL:   ${{ vars.AIBOT_MODEL   || 'zaicoding/glm-4.7' }}
          AIBOT_ZAI_BASE_URL:  ${{ secrets.AIBOT_ZAI_BASE_URL }}
          AIBOT_ZAI_API_TOKEN: ${{ secrets.AIBOT_ZAI_API_TOKEN }}
          AIBOT_GITEA_HOST:  ${{ github.server_url }}
          AIBOT_GITEA_TOKEN: ${{ github.token }}
          AIBOT_BOT_LOGIN:   ${{ vars.AIBOT_BOT_LOGIN }}

