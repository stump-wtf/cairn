# Gitea Actions CI on the self-hosted stump.wtf runners (free capacity).
# The runner has no Docker, so we can't stand up Postgres/MinIO here; the
# integration tests self-skip when CAIRN_TEST_DATABASE_URL is unset, so this
# job still gives real signal: gofmt-clean, vet, build, and the unit tests.
# Full integration (`make ci` with the service backends) runs locally/pre-merge.
#
# Restored after the convergence into stump.wtf/cairn dropped it (PR #1 brought
# back build+push, gitleaks, and aibot but not this test workflow).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: gofmt-check
        run: |
          out="$(gofmt -l $(find . -name '*.go' -not -path './vendor/*'))"
          if [ -n "$out" ]; then echo "gofmt needed on:"; echo "$out"; exit 1; fi
      - name: vet
        run: go vet ./...
      - name: build
        run: go build ./...
      - name: unit tests (integration tests skip without CAIRN_TEST_* backends)
        run: go test ./...
