---
# The single end-to-end pipeline. One run, one dependency graph:
#
#   secret scan → lint → test → build → ai review
#                                 │       (PRs only)
#                                 └─ main only ─→ image → deploy
#                                                       ↘ Gitea Pages
#
# Replaces four workflows that raced each other — .gitea/workflows/{ci.yml,
# build.yaml,gitleaks.yaml} plus aibot.yml's PR-open path. Each fired
# independently on `pull_request`, so a PR started an AI review, a secret scan
# and a test run at the same instant, and nothing could depend on anything else.
# The .github/ copies stay for the GitHub mirror; Gitea reads only this file and
# the narrowed aibot.yml beside it.
#
# Ordering is deliberate, not cosmetic:
#   * Secrets first — a leaked credential is the one finding that must not wait
#     behind a compile.
#   * AI review LAST, behind the build. As its own workflow it fired the moment
#     a PR opened and spent tokens reviewing code that had not been shown to
#     compile or pass tests. Now it only runs on a green build.
#   * Everything after `main-only` is fenced to a push on the default branch, so
#     a PR (including from a fork) can build the image and the docs site but can
#     never publish or deploy one.
#
# The lint/test/build and secret-scan stages live in stump.wtf/ci and are shared,
# not copied. See https://gitea.stump.rocks/stump.wtf/ci for why they are
# reusable rather than scoped, and stump.wtf/msgbrowse's pipeline.yaml for the
# same graph in another repo.
#
# WHAT IS DELIBERATELY *NOT* SHARED: the image job below. stump.wtf/ci's
# go-service.yaml can publish an image, but its publish path is the simple one —
# single-arch, no vulnerability scan. cairn's own job carries a Trivy scan that
# fails closed on HIGH/CRITICAL, docker/metadata-action tagging and a registry
# build cache. Adopting the shared publish would trade a security gate for
# uniformity, so `publish_image` stays false and this job is kept, exactly as
# stump.wtf/reduit keeps its own richer publish job for the same reason.
name: pipeline

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  pull-requests: write
  issues: write

concurrency:
  group: ${{ gitea.workflow }}-${{ gitea.ref }}
  cancel-in-progress: true

jobs:
  # ---- 1. secret scan ------------------------------------------------------
  secrets:
    uses: https://gitea.stump.rocks/stump.wtf/ci/.gitea/workflows/gitleaks.yaml@main
    secrets: inherit

  # ---- 2-4. lint + test + build -------------------------------------------
  build:
    needs: [secrets]
    uses: https://gitea.stump.rocks/stump.wtf/ci/.gitea/workflows/go-service.yaml@main
    with:
      # cairn's gate is `make ci` (fmt-check + vet + build + test-race), not the
      # `make check` these repos usually use. This job runs the race detector
      # over everything that does NOT need a database; the `integration` job
      # below stands up Postgres + Garage and runs the ~270 tests that self-skip
      # here. Both are required — this one for `-race`, that one for coverage.
      lint_cmd: make ci
      # `make ci` already runs `go build ./...`; a second build_cmd would only
      # recompile the same packages.
      build_cmd: ""
      # REQUIRED: `make ci` runs `go test -race`, and the race detector needs
      # cgo. The shared workflow pins CGO_ENABLED=0 by default, which would fail
      # this repo's gate outright.
      cgo_enabled: "1"
      # False on purpose — see the header. The image job below is cairn's own.
      publish_image: false
    secrets: inherit

  # ---- 4b. integration tests (Postgres + Garage) --------------------------
  # Roughly half of cairn's suite gates itself on CAIRN_TEST_DATABASE_URL and
  # self-skips when it is unset. Until this job existed nothing on the CI that
  # gates merges ever set it, so ~270 tests — every httpapi integration test,
  # the store/webhook/trajectory harnesses, the annotation anchor round-trips —
  # were dead weight. A reaction bug that posted a duplicate anchor and rendered
  # nothing shipped under a green pipeline because of exactly that gap.
  #
  # Garage, not MinIO: ADR-0008 names any S3-compatible store, and cairn's
  # objectstore is the MinIO *SDK* used as a plain S3 client. Running the
  # S3-backed harnesses (internal/store, internal/webhook — they take
  # CAIRN_TEST_S3_ENDPOINT and fall back to in-memory without it) against Garage
  # is what keeps "S3-compatible" an actually-tested claim rather than an
  # assumption, and matches what the deployment actually runs.
  #
  # RUNNER FACTS this encodes, established empirically by a probe run (cairn run
  # 4005) because none of these repos had ever stood a database up on Gitea:
  #   * Jobs run INSIDE a container (`ubuntu-latest:docker://…`), so `localhost`
  #     is the job's own netns — a sidecar there is NOT reachable that way, and
  #     copying the .github workflow's `localhost:5432` is the trap. Confirmed:
  #     "Connection refused" in 0.07s.
  #   * `host.docker.internal` does not resolve on this runner.
  #   * The host bridge gateway (172.17.0.1) DOES reach a published port, but a
  #     fixed host port collides — six runners share one daemon at capacity 3.
  #   * `docker network connect <net> "$HOSTNAME"` joins the RUNNING job
  #     container to a user-defined network, where Docker's embedded DNS then
  #     resolves sidecars by `--network-alias`. That is what this uses: no
  #     published ports, no collisions, everything scoped to the run id.
  #   * The runner mounts the host docker socket, so `docker run` from a step
  #     works — but `-v` mounts resolve on the HOST, where the job container's
  #     files do not exist. Garage needs a config file and ships a distroless
  #     image with no shell, so neither a bind mount nor an entrypoint heredoc
  #     works: `docker create` → `docker cp` → `docker start` does.
  integration:
    name: integration (postgres + garage)
    needs: [secrets]
    runs-on: ubuntu-latest
    # Six runners share one daemon at capacity 3, so a job that hangs holding a
    # network and two sidecars costs a third of the fleet until it is reaped.
    # The bootstrap waits are individually bounded; this bounds the whole job.
    timeout-minutes: 20
    env:
      NET: cairn-ci-${{ gitea.run_id }}
      PG: cairn-pg-${{ gitea.run_id }}
      GARAGE: cairn-garage-${{ gitea.run_id }}
      # Garage refuses to serve until a layout is applied, so the bucket and key
      # are created after the node is up rather than baked into the image.
      S3_BUCKET: cairn
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Start Postgres and Garage on a run-scoped network
        run: |
          set -euo pipefail
          docker network create "$NET"

          docker run -d --name "$PG" --network "$NET" --network-alias postgres \
            -e POSTGRES_USER=cairn -e POSTGRES_PASSWORD=cairn -e POSTGRES_DB=cairn \
            postgres:16-alpine

          # Generated per run, never committed: a literal 64-hex rpc_secret in
          # this file is precisely what the gitleaks job upstream exists to
          # catch, and it would be a real (if inert) credential in git history.
          # od fallback because this runner image is slimmer than it looks —
          # `ip` is absent from it, so openssl is not worth assuming either.
          randhex() {
            openssl rand -hex "$1" 2>/dev/null && return 0
            head -c "$1" /dev/urandom | od -An -tx1 | tr -d ' \n'
          }
          rpc_secret="$(randhex 32)"
          s3_key_id="GK$(randhex 12)"
          s3_secret="$(randhex 32)"
          # Exported under their FINAL names so later steps read real
          # environment variables rather than depending on `${{ env.X }}`
          # resolving a value a previous step wrote — one less act_runner
          # behaviour to have assumed correctly.
          echo "CAIRN_TEST_S3_ACCESS_KEY=${s3_key_id}" >> "$GITHUB_ENV"
          echo "CAIRN_TEST_S3_SECRET_KEY=${s3_secret}" >> "$GITHUB_ENV"

          cat > garage-ci.toml <<TOML
          metadata_dir = "/var/lib/garage/meta"
          data_dir     = "/var/lib/garage/data"
          db_engine    = "sqlite"
          replication_factor = 1
          rpc_bind_addr = "[::]:3901"
          rpc_public_addr = "127.0.0.1:3901"
          rpc_secret = "${rpc_secret}"
          [s3_api]
          s3_region = "us-east-1"
          api_bind_addr = "[::]:3900"
          [admin]
          api_bind_addr = "[::]:3903"
          TOML

          docker create --name "$GARAGE" --network "$NET" --network-alias garage \
            dxflrs/garage:v1.0.1
          docker cp garage-ci.toml "$GARAGE":/etc/garage.toml
          rm -f garage-ci.toml
          docker start "$GARAGE"

          # Join the job container itself so `postgres` / `garage` resolve here.
          docker network connect "$NET" "$HOSTNAME"

      - name: Wait for Postgres and bootstrap Garage
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            docker exec "$PG" pg_isready -U cairn >/dev/null 2>&1 && break
            sleep 1
          done
          docker exec "$PG" pg_isready -U cairn

          for i in $(seq 1 60); do
            docker exec "$GARAGE" /garage status >/dev/null 2>&1 && break
            sleep 1
          done

          # A single-node cluster still needs a layout before it will serve S3.
          node="$(docker exec "$GARAGE" /garage status | awk '/NO ROLE ASSIGNED/{print $1}')"
          docker exec "$GARAGE" /garage layout assign -z dc1 -c 1G "$node"
          docker exec "$GARAGE" /garage layout apply --version 1
          for i in $(seq 1 30); do
            docker exec "$GARAGE" /garage bucket create "$S3_BUCKET" >/dev/null 2>&1 && break
            sleep 1
          done
          # `key import`, not `key create`: create mints RANDOM credentials that
          # the test env would then have to scrape back out of stdout.
          #
          # stdout to /dev/null because `key import` ECHOES THE SECRET KEY, and a
          # credential printed into a CI log is bad practice even when — as here
          # — it is per-run and dies with the container: logs outlive the job,
          # get pasted around, and trip secret scanners. stderr is kept so a
          # genuine failure is still diagnosable, and `set -e` still catches it.
          docker exec "$GARAGE" /garage key import --yes -n cairn-ci \
            "$CAIRN_TEST_S3_ACCESS_KEY" "$CAIRN_TEST_S3_SECRET_KEY" >/dev/null
          docker exec "$GARAGE" /garage bucket allow --read --write --owner \
            "$S3_BUCKET" --key "$CAIRN_TEST_S3_ACCESS_KEY"

      # Fail FAST and LOUDLY if the wiring did not reach the test process.
      #
      # This job exists because ~270 tests self-skipped and reported green. That
      # failure mode is not fixed by standing up a database — it is fixed by
      # standing one up AND noticing when the tests do not see it. Without this
      # step a typo in the DSN, a sidecar that died after its readiness probe,
      # or a future change to how act_runner exports step env would put the
      # skips straight back and the job would still pass, with the added
      # confidence of a job named "integration". `-v` because Go prints skip
      # reasons only in verbose mode; two packages because they carry the DB
      # and S3 harnesses between them.
      - name: Assert the DB-gated tests are not self-skipping
        env:
          CAIRN_TEST_DATABASE_URL: postgres://cairn:cairn@postgres:5432/cairn?sslmode=disable
          CAIRN_TEST_S3_ENDPOINT: garage:3900
          CAIRN_TEST_S3_BUCKET: cairn
        run: |
          set -euo pipefail
          go test ./internal/store/ ./internal/webhook/ -count=1 -v 2>&1 | tee /tmp/probe.log
          if grep -q 'set CAIRN_TEST_DATABASE_URL' /tmp/probe.log; then
            echo "::error::the DB-gated tests self-skipped — CAIRN_TEST_DATABASE_URL never reached them"
            exit 1
          fi

      # `make test`, not `make ci`: the shared build job above already runs
      # fmt-check + vet + build + test-race. This job's job is COVERAGE — the
      # tests that cannot run without a database. Putting -race on top of the
      # DB and S3 round trips roughly quintuples this job's wall time on a
      # runner six workers already share; worth measuring before adopting.
      - name: make test
        env:
          CAIRN_TEST_DATABASE_URL: postgres://cairn:cairn@postgres:5432/cairn?sslmode=disable
          CAIRN_TEST_S3_ENDPOINT: garage:3900
          CAIRN_TEST_S3_BUCKET: cairn
        run: make test

      # The S3 harnesses are the dangerous half: unlike the DB ones they do not
      # skip when CAIRN_TEST_S3_ENDPOINT is unusable, they fall back to an
      # in-memory store and PASS. Nothing on the Go side distinguishes the two
      # runs, so "tested against Garage" would be an unfalsifiable claim. Ask
      # Garage instead — after a full suite the bucket must hold the objects the
      # store and webhook round-trips just wrote.
      - name: Assert the object-store tests really hit Garage
        run: |
          set -euo pipefail
          docker exec "$GARAGE" /garage bucket info "$S3_BUCKET"
          objects="$(docker exec "$GARAGE" /garage bucket info "$S3_BUCKET" \
            | awk '/^Objects:/{print $2; exit}')"
          if [ "${objects:-0}" -eq 0 ]; then
            echo "::error::Garage's bucket is empty — the S3-backed tests fell back to the in-memory store"
            exit 1
          fi
          echo "Garage holds $objects objects written by the suite."

      # Always: a leaked network or sidecar outlives the job on a shared daemon.
      - name: Tear down
        if: always()
        run: |
          docker network disconnect "$NET" "$HOSTNAME" >/dev/null 2>&1 || true
          docker rm -f "$PG" "$GARAGE" >/dev/null 2>&1 || true
          docker network rm "$NET" >/dev/null 2>&1 || true

  # ---- 5. ai review (PRs only, and only once the build is green) -----------
  # aibot.yml still exists beside this file, narrowed to the conversation
  # events (issue_comment, review, review_comment) so a maintainer can keep
  # talking to the bot on a PR. Opening a PR is handled here instead, so the
  # review waits for a build rather than racing it, and the two triggers cannot
  # both fire on the same event.
  review:
    needs: [build, integration]
    if: ${{ github.event_name == 'pull_request' }}
    uses: https://gitea.stump.rocks/stump.wtf/ci/.gitea/workflows/aibot.yaml@main
    secrets: inherit

  # ---- 6. merge-to-main gate ----------------------------------------------
  # A single explicit gate rather than repeating the same `if:` on three jobs.
  # Downstream stages just `needs: [main-only]`, so the fence is stated once and
  # cannot drift between them.
  main-only:
    needs: [build, integration]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Gate
        run: echo "on main with a green build — publishing" >> "$GITHUB_STEP_SUMMARY"

  # ---- 7. container image --------------------------------------------------
  # Moved verbatim from build.yaml, with its `on: push` replaced by the gate
  # above. `gitea.stump.rocks/stump.wtf/cairn:latest` is the tag cloud01's
  # ansible service config pulls, so this job is the thing that actually moves
  # production.
  #
  # Every step is still guarded on REGISTRY_TOKEN being set rather than the job
  # being guarded as a whole: secrets are not available in a job-level `if:`, so
  # the env-var indirection is the only way to make an unconfigured repo skip
  # quietly instead of failing red.
  image:
    name: build + scan + push
    needs: [main-only]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      REG: ${{ secrets.REGISTRY_TOKEN }}
    steps:
      - if: ${{ env.REG != '' }}
        uses: actions/checkout@v4

      - if: ${{ env.REG != '' }}
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - if: ${{ env.REG != '' }}
        name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: gitea.stump.rocks/stump.wtf/cairn
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha,prefix=sha-,format=short

      - if: ${{ env.REG != '' }}
        name: Log in to Gitea container registry
        uses: docker/login-action@v3
        with:
          registry: gitea.stump.rocks
          username: joestump-agent
          password: ${{ secrets.REGISTRY_TOKEN }}

      - if: ${{ env.REG != '' }}
        name: Build amd64 image for Trivy scan
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          load: true
          tags: gitea.stump.rocks/stump.wtf/cairn:scan-${{ gitea.run_id }}
          cache-from: type=registry,ref=gitea.stump.rocks/stump.wtf/cairn:buildcache

      - if: ${{ env.REG != '' }}
        name: Trivy image scan
        uses: docker://aquasec/trivy:latest
        with:
          args: image --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 --format table gitea.stump.rocks/stump.wtf/cairn:scan-${{ gitea.run_id }}

      - if: ${{ env.REG != '' }}
        name: Build and push (amd64)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=gitea.stump.rocks/stump.wtf/cairn:buildcache
          cache-to: type=registry,ref=gitea.stump.rocks/stump.wtf/cairn:buildcache,mode=max

  # ---- 8. deploy -----------------------------------------------------------
  # Moved verbatim from build.yaml. Note this is the ONE place cairn departs
  # from ADR-0002's ansible-pull model, and it is opt-in: inert until the repo
  # variable DEPLOY_ON_MERGE is set to true.
  deploy:
    name: deploy to cloud01 (ansible)
    # docs-image is in needs because the playbook's `docker compose pull` on
    # cloud01 fetches BOTH cairn:latest and cairn-docs:latest. With only
    # `needs: [image]` the deploy raced the docs-image job and could pull a
    # stale cairn-docs (the 2026-07-27 merge only dodged this by luck). Safe to
    # depend on: docs-image step-gates on REGISTRY_TOKEN and always concludes
    # success, so an unconfigured repo skips quietly rather than wedging deploy.
    needs: [image, docs-image]
    if: ${{ vars.DEPLOY_ON_MERGE == 'true' }}
    runs-on: ubuntu-latest
    env:
      ANSIBLE_FORCE_COLOR: 'true'
      DOCKER_TIMEOUT: 600
      # AppRole rather than a static token. A static VAULT_TOKEN in a repo secret
      # cannot re-authenticate: it dies at max-TTL and takes every subsequent
      # deploy with it, silently — the 2026-07-01 vault-agent OMG, repeated in CI.
      # The runner logs in per run and exports a short-lived token scoped to
      # secret/data/cloud01/* only (policy deploy-cloud01). Requires
      # ansible-runner >= v2.
      VAULT_ROLE_ID: ${{ secrets.VAULT_ROLE_ID }}
      VAULT_SECRET_ID: ${{ secrets.VAULT_SECRET_ID }}
    steps:
      - name: Checkout stumpcloud/ansible (playbooks + inventory)
        uses: actions/checkout@v4
        with:
          repository: stumpcloud/ansible
          ref: main
          token: ${{ secrets.GIT_AUTH_TOKEN }}

      # NOTE: no job-level ssh-agent step. One used to sit here and it was a
      # no-op that *looked* load-bearing: the agent's socket lives in the job
      # container, ansible-playbook runs inside the ansible-runner action
      # container, and the two never meet. The key that actually reaches
      # ansible is the ssh_private_key input below, which ansible-runner
      # v2.1.0+ installs inside its own container (earlier versions silently
      # dropped it — the undeclared input was discarded by the runner, which
      # is why this job spent its whole life red on
      # "Permission denied (publickey)").
      - name: Log in to Gitea (pull the ansible-runner action image)
        uses: docker/login-action@v3
        with:
          registry: gitea.stump.rocks
          username: joestump-agent
          password: ${{ secrets.GIT_AUTH_TOKEN }}

      - name: Deploy Cairn to cloud01
        # v2.1.0 exactly: the first release where ssh_private_key is a real,
        # delivered input. @v2 was not moved forward to it, so do not "tidy"
        # this back to the major alias without checking what v2 points at.
        uses: https://gitea.stump.rocks/stumpcloud/ansible-runner@v2.1.0
        with:
          playbook: playbooks/services/cairn.yaml
          inventory: gva.yaml
          ssh_hosts: cloud01.stump.rocks
          ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY }}

  # ---- 8b. docs image ------------------------------------------------------
  # The same record the Pages job publishes, rebuilt for the PRODUCT domain and
  # baked into a static-server image. This bundle is cairn.stump.wtf's public
  # face: the marketing homepage at /, the record at /docs/intro/ and friends —
  # cloud01's edge Caddy routes `/`, `/docs/*` and the bundle's static
  # namespaces to the cairn-docs container, and everything else to the app.
  # Two builds, not one bundle rsynced twice, because a Docusaurus bundle bakes
  # its origin and base path into every canonical link, og:url and the sitemap:
  # the Pages bundle advertises stump-wtf.pages.stump.rocks/cairn/, this one
  # cairn.stump.wtf/.
  #
  # DOCS_BASE_URL is `/`, and must stay `/`: a bundle based at /docs/ hydrates
  # into the 404 page when served at `/` — the client router treats any path
  # outside its baseUrl as not found (this shipped once; the homepage rendered,
  # then React replaced it with "Page Not Found"). docusaurus.config.ts
  # documents the full failure catalogue.
  #
  # The site is built on the runner (npm) and the image only COPYs the static
  # output — no Node stage, so the docker build fetches nothing. Same
  # REGISTRY_TOKEN step-guard idiom as the image job above.
  docs-image:
    name: docs image (cairn.stump.wtf/docs)
    needs: [main-only]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      REG: ${{ secrets.REGISTRY_TOKEN }}
    steps:
      - if: ${{ env.REG != '' }}
        uses: actions/checkout@v4

      - if: ${{ env.REG != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: website/package-lock.json

      - if: ${{ env.REG != '' }}
        name: Build the record for the app domain (rooted at /)
        working-directory: website
        run: npm ci --no-audit --no-fund && npm run build
        env:
          DOCS_URL: https://cairn.stump.wtf
          DOCS_BASE_URL: /

      - if: ${{ env.REG != '' }}
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - if: ${{ env.REG != '' }}
        name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: gitea.stump.rocks/stump.wtf/cairn-docs
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha,prefix=sha-,format=short

      - if: ${{ env.REG != '' }}
        name: Log in to Gitea container registry
        uses: docker/login-action@v3
        with:
          registry: gitea.stump.rocks
          username: joestump-agent
          password: ${{ secrets.REGISTRY_TOKEN }}

      - if: ${{ env.REG != '' }}
        name: Build and push the docs image (amd64)
        uses: docker/build-push-action@v5
        with:
          context: website
          file: website/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=gitea.stump.rocks/stump.wtf/cairn-docs:buildcache
          cache-to: type=registry,ref=gitea.stump.rocks/stump.wtf/cairn-docs:buildcache,mode=max

  # ---- 9. Gitea Pages ------------------------------------------------------
  # The Docusaurus site under website/, published to
  # https://stump.wtf.pages.stump.rocks/cairn/. New here: the .github/ copy uses
  # actions/deploy-pages, which has no Gitea equivalent, so the site has only
  # ever been published to GitHub Pages. Publishing goes through
  # stumpcloud/garage-pages-deploy instead.
  #
  # Inert until the repo variable PUBLISH_PAGES is set to true, following the
  # DEPLOY_ON_MERGE idiom above: the deploy needs PAGES_ACCESS_KEY_ID /
  # PAGES_SECRET_ACCESS_KEY, and a job that goes red on a repo that has not been
  # given them would make every merge to main look broken.
  pages:
    needs: [main-only]
    if: ${{ vars.PUBLISH_PAGES == 'true' }}
    uses: https://gitea.stump.rocks/stump.wtf/ci/.gitea/workflows/static-site.yaml@main
    with:
      working_directory: website
      source_dir: website/build
      # Exported to the build as DOCS_URL. garage-pages-deploy slugifies the
      # owner — dots to dashes — so stump.wtf serves as stump-wtf; passing it
      # here means the deploy target and the URL the bundle bakes into its
      # canonical links cannot drift apart. docusaurus.config.ts carries the
      # same value as its default, so a local build is not wrong either.
      site_url: https://stump-wtf.pages.stump.rocks
    secrets: inherit

  # ---- 11. tag gate --------------------------------------------------------
  # The release counterpart to main-only above: stated once as a job, so the
  # two release stages just `needs: [tag-only]` and the fence cannot drift
  # between them. A tag can be pushed at any commit, so both stages sit behind
  # the same build + integration graph the rest of the pipeline uses rather
  # than releasing on trust.
  tag-only:
    needs: [build, integration]
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    steps:
      - name: Gate
        run: echo "tagged build is green — releasing ${{ github.ref_name }}" >> "$GITHUB_STEP_SUMMARY"

  # ---- 12. release ---------------------------------------------------------
  # Builds the cross-platform `cairn` CLI and publishes it to the PUBLIC
  # stump-wtf/cairn-cli repo (see .goreleaser.yaml). Only the client ships:
  # the server is a container image built by the image job above.
  #
  # This runs on Gitea, not the GitHub mirror, because this runner is the only
  # host that can reach both sides — Gitea over the LAN and github.com
  # outbound. stump.wtf/msgbrowse learned that the expensive way: the same step
  # on a GitHub-hosted runner died at curl exit 28 on every tag for six
  # releases, and nobody noticed because the release itself went green.
  release:
    needs: [tag-only]
    runs-on: ubuntu-latest
    env:
      GH_RELEASE_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
    steps:
      - name: Require the release token
        # Deliberately fatal, and deliberately not a job-level `if:` — secrets
        # are not available there, so the env indirection is the only way to
        # test one. The image job above skips quietly when unconfigured; this
        # one must not. A tag that publishes nothing and still reports green is
        # the failure mode that leaves `brew` serving a stale version for weeks.
        run: |
          set -euo pipefail
          if [ -z "${GH_RELEASE_TOKEN:-}" ]; then
            echo "::error::GH_RELEASE_TOKEN is not set. Create a GitHub PAT with" \
                 "contents:write on stump-wtf/cairn-cli and add it as an org or" \
                 "repo Actions secret named GH_RELEASE_TOKEN. Without it the tag" \
                 "lands but nothing is published."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          # goreleaser derives the version and changelog from tag history, so a
          # shallow clone degrades rather than failing: it logs "running against
          # a shallow clone" and computes an empty changelog.
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify the CLI imports no server code
        # The import-graph gate, run before anything is built. goreleaser also
        # runs this script as a post-build hook against each compiled binary
        # (.goreleaser.yaml), so the artifact is checked as well as the graph.
        run: make verify-cli

      - name: GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          # goreleaser reads GITHUB_TOKEN; the value is the cairn-cli PAT.
          GITHUB_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}

  # ---- 13. Homebrew tap bump ----------------------------------------------
  # Bumps stump.wtf/homebrew-tap from the assets the release job just
  # published. cairn's formula is a BINARY formula — unlike harness, msgbrowse
  # and reduit, which build from a public source tarball, an option cairn does
  # not have — so the formula pins four url/sha256 pairs and this job rewrites
  # all of them.
  tap-bump:
    needs: [release]
    runs-on: ubuntu-latest
    env:
      TAP_PUSH_TOKEN: ${{ secrets.TAP_PUSH_TOKEN }}
      GH_REPO_URL: https://github.com/stump-wtf/cairn-cli
    steps:
      - name: Require the tap push token
        run: |
          set -euo pipefail
          if [ -z "${TAP_PUSH_TOKEN:-}" ]; then
            echo "::error::TAP_PUSH_TOKEN is not set. Create a Gitea PAT with" \
                 "write:repository on stump.wtf/homebrew-tap and add it as an" \
                 "org or repo Actions secret named TAP_PUSH_TOKEN."
            exit 1
          fi

      - name: Wait for the published assets
        # HEAD the download URLs rather than the API: asset URLs are not
        # subject to the unauthenticated API rate limit, and a 200 means the
        # bytes are actually fetchable, which is what the tap needs to be true.
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VER="${TAG#v}"
          { echo "TAG=$TAG"; echo "VER=$VER"; } >> "$GITHUB_ENV"
          for i in $(seq 1 40); do
            ok=1
            for pair in darwin_arm64 darwin_amd64 linux_arm64 linux_amd64; do
              url="${GH_REPO_URL}/releases/download/${TAG}/cairn_${VER}_${pair}.tar.gz"
              curl -sfIL --max-time 30 -o /dev/null "$url" || ok=0
            done
            [ "$ok" -eq 1 ] && { echo "all four archives present"; exit 0; }
            sleep 15
          done
          echo "::error::${TAG} assets never appeared on ${GH_REPO_URL} after 10m."
          exit 1

      - name: Download, checksum, and bump the tap
        run: |
          set -euo pipefail
          git clone -q "https://gitea.stump.rocks/stump.wtf/homebrew-tap.git" tap
          F="tap/Formula/cairn.rb"

          # The formula interpolates v#{version} into its urls, so a bump only
          # has to rewrite the version line and the four sha256 lines. Each
          # sha256 carries a trailing arch marker (`# darwin_arm64`), so a
          # rewrite cannot land on the wrong architecture — which is exactly
          # what a positional edit would get wrong, silently, and ship.
          sed -i -E "s|^(  version \")[^\"]+(\")|\1${VER}\2|" "$F"
          grep -q "version \"${VER}\"" "$F"

          for pair in darwin_arm64 darwin_amd64 linux_arm64 linux_amd64; do
            url="${GH_REPO_URL}/releases/download/${TAG}/cairn_${VER}_${pair}.tar.gz"
            sha="$(curl -sfL --retry 3 --retry-all-errors "$url" | sha256sum | cut -d' ' -f1)"
            if [ -z "$sha" ]; then
              echo "::error::empty checksum for ${pair} — refusing to write the formula"
              exit 1
            fi
            sed -i -E "s|^([[:space:]]*sha256 \")[0-9a-f]{64}(\" # ${pair})\$|\1${sha}\2|" "$F"
            # sed exits 0 when its pattern misses, so assert the edit landed
            # rather than trusting it. A missed rewrite leaves the previous
            # release's bytes pinned, and `brew install` then fails the
            # checksum for every user rather than for us.
            grep -q "sha256 \"${sha}\" # ${pair}" "$F"
          done

          cd tap
          git config user.name "joestump-agent"
          git config user.email "joestump-agent@noreply.stump.rocks"
          if git diff --quiet; then
            echo "tap already at v${VER} — nothing to push"
          else
            git commit -aqm "toil(cairn): bump formula to v${VER} (automated tap bump)"
            git -c http.extraheader="Authorization: token ${TAP_PUSH_TOKEN}" \
              push -q origin HEAD:main
            echo "tap bumped to v${VER}" >> "$GITHUB_STEP_SUMMARY"
          fi
