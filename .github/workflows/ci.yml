name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cairn
          POSTGRES_PASSWORD: cairn
          POSTGRES_DB: cairn
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cairn"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    env:
      # Presence of these turns on the store integration tests.
      CAIRN_TEST_DATABASE_URL: postgres://cairn:cairn@localhost:5432/cairn?sslmode=disable
      CAIRN_TEST_S3_ENDPOINT: localhost:9000
      CAIRN_TEST_S3_ACCESS_KEY: minioadmin
      CAIRN_TEST_S3_SECRET_KEY: minioadmin
      CAIRN_TEST_S3_BUCKET: cairn

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: gofmt
        run: |
          out="$(gofmt -l $(find . -name '*.go' -not -path './vendor/*'))"
          if [ -n "$out" ]; then echo "gofmt needed on:"; echo "$out"; exit 1; fi

      - name: go vet
        run: go vet ./...

      - name: build
        run: go build ./...

      # The official minio image needs a "server /data" command, which GitHub
      # service containers can't supply — so start it as a step instead. The
      # store auto-creates the bucket on first connect, so no mc bootstrap.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio:latest server /data
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:9000/minio/health/ready >/dev/null 2>&1; then
              echo "minio ready"; exit 0
            fi
            sleep 1
          done
          echo "minio did not become ready"; docker logs minio; exit 1

      - name: test (race)
        run: go test -race ./...

  # The token-layer guard is a source-level check that runs at Docusaurus config
  # load, so building the site here is what makes it fire BEFORE merge rather
  # than after. SPEC-0010 REQ "Build and Deployment" owns the full trigger shape
  # (record paths, deploy-on-record-change); this is the minimum that stops a
  # pull request from landing a hardcoded colour or a recoloured category.
  website:
    name: Website
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4

      # 22 rather than 20, matching website/package.json `engines` and the deploy
      # workflow. The record pipeline's entry points are TypeScript executed
      # directly by `node` (`npm run generate`, and the plugin's own test files),
      # and unflagged type stripping only exists from 22.18.0. On 20 both the
      # typecheck step and the suite below die with ERR_UNKNOWN_FILE_EXTENSION.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: install
        run: npm ci

      # The whole suite, not just the token guard. The link guards are the
      # enforcement mechanism behind SPEC-0010 REQ "No Repository Links" and REQ
      # "Link and Anchor Integrity", and a guard whose own tests never run in CI
      # can start passing vacuously — break the attribute scanner and the build
      # still goes green while no longer looking at anything.
      - name: tests
        run: npm test

      - name: typecheck
        run: npm run typecheck

      # Fails on any token-layer violation: the check throws at config load.
      - name: build
        run: npm run build
