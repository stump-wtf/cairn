name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cairn
          POSTGRES_PASSWORD: cairn
          POSTGRES_DB: cairn
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cairn"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    env:
      # Presence of these turns on the store integration tests.
      CAIRN_TEST_DATABASE_URL: postgres://cairn:cairn@localhost:5432/cairn?sslmode=disable
      CAIRN_TEST_S3_ENDPOINT: localhost:9000
      CAIRN_TEST_S3_ACCESS_KEY: minioadmin
      CAIRN_TEST_S3_SECRET_KEY: minioadmin
      CAIRN_TEST_S3_BUCKET: cairn

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      # MinIO can't run as a GitHub service container (its entrypoint needs the
      # `server` argument, which services can't supply), and the bitnami image's
      # `latest` tag was retired. Start the official image as a step instead; the
      # store creates the bucket itself (objectstore.NewMinIO).
      - name: Start MinIO
        run: |
          docker run -d --name minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio:latest server /data
          echo "waiting for MinIO..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:9000/minio/health/live >/dev/null; then
              echo "MinIO ready"; exit 0
            fi
            sleep 1
          done
          echo "MinIO did not become ready" >&2
          docker logs minio || true
          exit 1

      - name: gofmt
        run: |
          out="$(gofmt -l $(find . -name '*.go' -not -path './vendor/*'))"
          if [ -n "$out" ]; then echo "gofmt needed on:"; echo "$out"; exit 1; fi

      - name: go vet
        run: go vet ./...

      - name: build
        run: go build ./...

      - name: test (race)
        run: go test -race ./...
