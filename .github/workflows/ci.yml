name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cairn
          POSTGRES_PASSWORD: cairn
          POSTGRES_DB: cairn
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cairn"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

      minio:
        image: bitnami/minio:latest
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
          MINIO_DEFAULT_BUCKETS: cairn
        ports:
          - 9000:9000
        options: >-
          --health-cmd "mc ready local || curl -f http://localhost:9000/minio/health/live"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 20

    env:
      # Presence of these turns on the store integration tests.
      CAIRN_TEST_DATABASE_URL: postgres://cairn:cairn@localhost:5432/cairn?sslmode=disable
      CAIRN_TEST_S3_ENDPOINT: localhost:9000
      CAIRN_TEST_S3_ACCESS_KEY: minioadmin
      CAIRN_TEST_S3_SECRET_KEY: minioadmin
      CAIRN_TEST_S3_BUCKET: cairn

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: gofmt
        run: |
          out="$(gofmt -l $(find . -name '*.go' -not -path './vendor/*'))"
          if [ -n "$out" ]; then echo "gofmt needed on:"; echo "$out"; exit 1; fi

      - name: go vet
        run: go vet ./...

      - name: build
        run: go build ./...

      - name: test (race)
        run: go test -race ./...
