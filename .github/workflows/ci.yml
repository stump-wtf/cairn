name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cairn
          POSTGRES_PASSWORD: cairn
          POSTGRES_DB: cairn
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cairn"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    env:
      # Presence of these turns on the store integration tests.
      CAIRN_TEST_DATABASE_URL: postgres://cairn:cairn@localhost:5432/cairn?sslmode=disable
      CAIRN_TEST_S3_ENDPOINT: localhost:9000
      CAIRN_TEST_S3_ACCESS_KEY: minioadmin
      CAIRN_TEST_S3_SECRET_KEY: minioadmin
      CAIRN_TEST_S3_BUCKET: cairn

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: gofmt
        run: |
          out="$(gofmt -l $(find . -name '*.go' -not -path './vendor/*'))"
          if [ -n "$out" ]; then echo "gofmt needed on:"; echo "$out"; exit 1; fi

      - name: go vet
        run: go vet ./...

      - name: build
        run: go build ./...

      # The official minio image needs a "server /data" command, which GitHub
      # service containers can't supply — so start it as a step instead. The
      # store auto-creates the bucket on first connect, so no mc bootstrap.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio:latest server /data
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:9000/minio/health/ready >/dev/null 2>&1; then
              echo "minio ready"; exit 0
            fi
            sleep 1
          done
          echo "minio did not become ready"; docker logs minio; exit 1

      - name: test (race)
        run: go test -race ./...

  # Governing: ADR-0014, SPEC-0010 REQ "Build and Deployment"
  #
  # This job is what makes the pipeline's guards fire BEFORE merge. The token
  # guard, the front-matter and referential-integrity checks, the hardcoded-count
  # check and the first-party asset check all throw at Docusaurus config load, so
  # they fire on any command that loads the config; the bundle scan and the CSP
  # seal are postBuild, so only a FULL BUILD exercises them. Hence `npm run
  # build` rather than a lint.
  #
  # It has no `paths:` filter, and that is deliberate rather than an omission.
  # The site is generated from `docs/adrs/` and `docs/openspec/specs/`, so a pull
  # request that touches only a record file can break the site build; REQ "Build
  # and Deployment" requires CI to fail on that pull request rather than after
  # merge. The workflow-level `on:` above already covers every pull request and
  # every push to main, which is a superset of the three paths the requirement
  # names.
  website:
    name: Website
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4

      # 22, not 20, and this job did not previously build on 20 at all: the
      # record pipeline's entry points are TypeScript run directly by `node`
      # (`npm run generate`, and the test files), and unflagged type stripping
      # only exists from Node 22.18. website/package.json `engines` has said
      # `^22.18.0 || >=24` since the pipeline landed; this job contradicted it.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: install
        run: npm ci

      - name: unit tests
        run: npm test

      - name: typecheck
        run: npm run typecheck

      # Fails on a token-layer violation, a broken record, a hardcoded count, a
      # third-party asset, or a credential in the bundle. Every one of those
      # throws out of the build rather than warning.
      - name: build
        run: npm run build
