name: Deploy site to GitHub Pages

# Governing: ADR-0014, SPEC-0010 REQ "Build and Deployment"
#
# The record directories are in this filter and that is the whole point of
# ADR-0014. The site is generated from `docs/adrs/` and `docs/openspec/specs/`,
# so a commit that adds ADR-0015 CHANGES THE PUBLISHED SITE — and under the
# previous filter (`website/**` only) it matched nothing here and never
# deployed. The headline promise, "adding an ADR publishes it", was false by one
# line of YAML.
on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'docs/adrs/**'
      - 'docs/openspec/specs/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

# Governing: ADR-0014, SPEC-0010 REQ "Deployment Least Privilege"
#
# Nothing by default; each job is granted only what it cannot publish without.
# `contents: write` is deliberately absent — this workflow publishes a static
# bundle and has no business writing to the repository — and the build job,
# which is the one that executes third-party code from `npm ci`, gets read
# access and nothing else. The Pages credentials live only on the job that
# actually calls the deploy action.
permissions: {}

# Allow one concurrent deployment; don't cancel an in-progress run.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: website
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Governing: ADR-0014, SPEC-0010 REQ "Record Content Pipeline"
      # 22 rather than 20, matching website/package.json `engines`: the record
      # pipeline's entry points are TypeScript executed directly by `node`, and
      # unflagged type stripping only exists from 22.18.0. `docusaurus build`
      # itself would survive on 20, because jiti transpiles the config — but a
      # declared engine the deploy job contradicts is a trap, not a saving.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Governing: ADR-0014, SPEC-0010 REQ "Deployment Least Privilege"
      # Governing: ADR-0014, SPEC-0010 REQ "Security Headers"
      #
      # Redundant on paper — the same scan runs from the site's `postBuild` hook,
      # so a build that reached this line already passed it. It is here anyway
      # because the requirement is about the DEPLOY: "the bundle MUST be scanned
      # for these before the deploy step runs, and a match MUST fail the
      # deployment". A reader of this workflow can see that guarantee without
      # having to know that a Docusaurus plugin enforces it, and the guarantee
      # survives someone swapping the build step for a prebuilt artifact.
      - name: Scan bundle for third-party assets and secrets
        run: npm run scan:bundle

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/build

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
