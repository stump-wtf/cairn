# Publishes the cairn container image to ghcr.io when a v* tag is pushed.
#
# THIS WORKFLOW PUBLISHES THE IMAGE AND NOTHING ELSE. Binaries, the GitHub
# Release, and the Homebrew tap bump are all owned by the Gitea pipeline
# (.gitea/workflows/pipeline.yaml: tag-only -> release -> tap-bump), which
# publishes archives to stump-wtf/cairn-cli via .goreleaser.yaml.
#
# That split is deliberate, and it replaces a real collision. This file used to
# run goreleaser itself, with the same .goreleaser.yaml the Gitea job uses. Tags
# propagate to the mirror, so a single v* tag fired BOTH runners against the
# same config and the same asset names, and goreleaser's
# `replace_existing_artifacts: true` meant they overwrote each other silently
# rather than erroring. Whichever finished last won and nothing reported a
# problem. (The old job was also pointed at a repo its GITHUB_TOKEN does not
# cover: the token is scoped to stump-wtf/cairn while the config targets
# stump-wtf/cairn-cli.)
#
# One tag, two writers, two destinations, no shared names:
#   * Gitea  -> binaries to stump-wtf/cairn-cli, then the tap bump
#   * GitHub -> the ghcr.io image, here
#
# ghcr.io lives here because GITHUB_TOKEN is the credential that works on this
# host. Pushing it from Gitea would mean putting another GitHub PAT into Gitea
# Actions, and the currently-broken push mirrors are exactly that pattern
# failing.
name: Release image

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    name: build + scan + push (ghcr.io)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Mirrors the Gitea image job's tagging so the two registries do not drift
      # in how they name the same build.
      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/stump-wtf/cairn
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Scan before publishing, not after. A single-arch amd64 build is loaded
      # locally so Trivy has something to inspect; the multi-arch push below
      # only happens if this gate passes.
      - name: Build amd64 image for the Trivy scan
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          load: true
          tags: ghcr.io/stump-wtf/cairn:scan-${{ github.run_id }}

      - name: Trivy image scan (fails closed on CRITICAL/HIGH)
        uses: docker://aquasec/trivy:latest
        with:
          args: >-
            image --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1
            --format table ghcr.io/stump-wtf/cairn:scan-${{ github.run_id }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
