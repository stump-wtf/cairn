# Publishes a GitHub Release when a v* tag is pushed, using the matching
# CHANGELOG.md section as the release notes. The container image is built and
# pushed to the private homelab registry out-of-band (the runner cannot reach
# it); once the `cairn` CLI lands (v0.0.3) a goreleaser job builds and attaches
# its cross-platform binaries here.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Publish release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract CHANGELOG section for this tag
        id: notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" {grab=1; next}
            grab && /^## \[/ {exit}
            grab {print}
          ' CHANGELOG.md > release-notes.md
          echo "Extracted $(wc -l < release-notes.md) lines for $version"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          name: ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}

  # Builds and attaches the cross-platform `cairn` CLI binaries (SPEC-0008).
  # The CLI is a pure REST client with no CGO deps, so goreleaser ships static
  # darwin/linux/windows amd64+arm64 binaries (.goreleaser.yaml). The `cairnd`
  # server is deployed separately as a container image and is not built here.
  #
  # Runs AFTER `release`, not beside it: both jobs address the same GitHub
  # Release for the tag, and in parallel whichever lands first creates it. When
  # that is goreleaser, the release is born with goreleaser's own generated
  # notes and `release` then overwrites the body — so the notes a reader sees
  # depend on a race. Ordering it behind `release` means the release always
  # already exists with the CHANGELOG.md section as its body, and goreleaser
  # only uploads archives onto it (release.mode: keep-existing).
  binaries:
    name: Build CLI binaries
    needs: [release]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # REQUIRED by goreleaser: the default depth-1 checkout has no history
          # and no earlier tags, so it logs "running against a shallow clone"
          # and computes an empty changelog (verified against a depth-1 clone of
          # a tag — it degrades rather than failing, which is why the shallow
          # version looks like it works).
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
