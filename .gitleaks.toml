# Gitleaks config for Cairn. Extends the default ruleset and allowlists known
# false positives so the secret scan stays green:
#   - hermetic in-test OIDC issuer signing keys and other fixtures in *_test.go
#   - illustrative example values in design docs (ADRs / OpenSpec markdown)
# Real secrets are injected from OpenBao at deploy time as CAIRN_* env, never
# committed — so allowlisting test/doc paths does not hide any live credential.
[extend]
useDefault = true

[allowlist]
description = "Test fixtures and design-doc examples (no live secrets)."
paths = [
  '''.*_test\.go$''',
  '''docs/.*\.md$''',
  '''website/.*\.(md|mdx)$''',
]
# The website's own credential scanners have to be tested against something
# credential-shaped, so their fixtures trip the scanner that scans them:
# `assertNoSecretsInData` and the bundle scan both assert they CATCH a GitHub
# token, using this obviously-sequential placeholder.
#
# Allowlisted by VALUE, not by path. The paths above are whole trees, and
# adding `website/.*\.test\.(ts|mjs)$` to them would blind the scan to a real
# credential pasted into any website test. One dummy string cannot hide
# anything else.
regexes = [
  '''ghp_0123456789abcdef0123456789abcdef0123''',
]
