# GoReleaser configuration for Cairn — one binary, `cairn` (ADR-0031).
# https://goreleaser.com
#
# One build, one archive, one release:
#
#   * `cairn` — the whole program: the CLI surface AND the server (`cairn
#     serve`), for linux, darwin and windows on amd64 and arm64. Archive:
#     cairn_<ver>_<os>_<arch>.
#
# The archive carries its one binary and LICENSE, and
# scripts/verify-release-archives.sh fails the release job if it ever holds
# anything else. Pure Go with no CGO deps, so a static CGO_ENABLED=0 build is
# safe on every target.

version: 2

project_name: cairn

before:
  hooks:
    - go mod tidy

builds:
  # Reproducible on purpose: Harness's manifest pins the archive by URL and
  # SHA-256 (cairn#361), and the release job re-runs against an existing tag
  # with replace_existing_artifacts, so a rebuild that produced different
  # bytes would silently invalidate every pin. -trimpath drops the builder's
  # paths, and mod_timestamp fixes the file mtime the archive records; the
  # archive pins the tar headers the same way (see archives below).
  - id: cairn
    main: ./cmd/cairn
    binary: cairn
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/stump-wtf/cairn/internal/clicmd.Version={{.Version}}
      - -X github.com/stump-wtf/cairn/internal/clicmd.Commit={{.Commit}}
      - -X github.com/stump-wtf/cairn/internal/clicmd.Date={{.Date}}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: cairn
    ids:
      - cairn
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    # Ship the binary and the licence — nothing else. Left unset, goreleaser's
    # default sweeps README*/CHANGELOG*/LICENSE* from the repo root, and a
    # downloadable tarball then carried this repo's README, whose links point at
    # docs/adrs/, docs/openspec/ and docs/DESIGN.md — dead links for whoever
    # unpacks it, since none of that travels in the archive. The key stays
    # explicitly listed for that reason: omitting it is what re-enables the
    # default, so an empty list and an absent key are not the same thing.
    #
    # LICENSE travels with the binary because a distributed binary should carry
    # its grant rather than leave the recipient guessing. Cairn is MIT, and this
    # is the whole grant — not a subset of one, and not scoped to the client.
    files:
      - src: LICENSE
        info:
          owner: root
          group: root
          mode: 0644
          mtime: "{{ .CommitDate }}"
    builds_info:
      owner: root
      group: root
      mode: 0755
      mtime: "{{ .CommitDate }}"
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}

checksum:
  name_template: 'checksums.txt'

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^ci:'
      - Merge pull request
      - Merge branch
  groups:
    - title: Features
      regexp: '^.*?feat(\([^)]*\))?:.*$'
      order: 0
    - title: Fixes
      regexp: '^.*?fix(\([^)]*\))?:.*$'
      order: 1
    - title: Security
      regexp: '^.*?sec(\([^)]*\))?:.*$'
      order: 2
    - title: Other
      order: 999

release:
  # Binaries publish to stump-wtf/cairn. goreleaser targeting a repo other
  # than the one it builds from is the point: archives become downloadable
  # without depending on where the source lives (ADR-0031 retired the old
  # stump-wtf/cairn-cli destination).
  #
  # ONE TAG, TWO WRITERS, NO SHARED NAMES:
  #   * this config, run by the Gitea pipeline -> the cairn archives to
  #     stump-wtf/cairn, then the Homebrew tap bump
  #   * .github/workflows/release.yml           -> the ghcr.io image, nothing else
  #
  # That split replaced a real collision. release.yml used to run goreleaser
  # against THIS file, and tags propagate to the mirror, so a single v* tag
  # fired both runners writing identical asset names — with
  # replace_existing_artifacts below turning the collision into a silent
  # overwrite rather than an error. Whichever finished last won, and nothing
  # reported a problem. The writers still do not share asset names: only this
  # one writes release assets at all.
  github:
    owner: stump-wtf
    name: cairn
  draft: false
  prerelease: auto
  name_template: "v{{.Version}}"
  # One kind of archive sits on every release: cairn_<version>_<os>_<arch>,
  # the whole program (CLI and, since ADR-0031, the server via `cairn serve`).
  header: |
    ## What am I downloading?

    - **`cairn_<version>_<os>_<arch>`**: the **cairn binary** — everything in
      one. Use it as the CLI from a terminal or script, or run the server with
      `cairn serve`. Most self-hosters use the container image instead:
      `ghcr.io/stump-wtf/cairn:{{ .Version }}`.

    Each archive holds its one binary plus `LICENSE`. `checksums.txt` covers it.
  # goreleaser owns the release notes, generated from the changelog block above.
  #
  # This previously carried a different justification: that release.yml created
  # the release first with the matching CHANGELOG.md section as its body, and
  # goreleaser only attached archives to it. That flow was never possible —
  # release.yml runs against stump-wtf/cairn while this config targeted
  # stump-wtf/cairn-cli, so the two were never addressing the same release — and
  # release.yml no longer creates one at all.
  #
  # keep-existing stays for a reason that IS real: re-running a tag must not
  # clobber the notes on a release that already exists (see
  # replace_existing_artifacts below, which exists for the same retry path).
  mode: keep-existing
  # Re-running the job against a tag that already carries archives is the
  # normal recovery path (a half-finished upload, a re-run after fixing a
  # secret). goreleaser defaults this to false and errors on the first name
  # collision, which turns every retry into a manual "delete the assets by
  # hand" step.
  replace_existing_artifacts: true
