# GoReleaser configuration for Cairn — the cairn CLI and the cairnd server.
# https://goreleaser.com
#
# Two builds, two archives, one release:
#
#   * `cairn`  — the CLI (SPEC-0008: the human's terminal surface), for linux,
#     darwin and windows on amd64 and arm64. Archive: cairn_<ver>_<os>_<arch>.
#   * `cairnd` — the server, for linux and darwin on amd64 and arm64, for
#     operators who run it natively rather than as the container image (the
#     image is still built by the pipeline's image job and release.yml).
#     Harness's native runtime pins this archive by URL and SHA-256 (cairn#361),
#     so its build is reproducible: see the cairnd build below.
#     Archive: cairnd_<ver>_<os>_<arch>.
#
# The archives never mix. Each carries its own binary and LICENSE, and
# scripts/verify-release-archives.sh fails the release job if either ever holds
# anything else. Both are pure Go with no CGO deps, so static CGO_ENABLED=0
# builds are safe on every target.

version: 2

project_name: cairn

before:
  hooks:
    - go mod tidy

builds:
  - id: cairn
    main: ./cmd/cairn
    binary: cairn
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/stump-wtf/cairn/internal/clicmd.Version={{.Version}}
      - -X github.com/stump-wtf/cairn/internal/clicmd.Commit={{.Commit}}
      - -X github.com/stump-wtf/cairn/internal/clicmd.Date={{.Date}}
    hooks:
      # The cairn archive ships the cairn CLI and nothing else. goreleaser
      # aborts the release if a post hook fails, so this is the last place the
      # check can still stop a bad artifact rather than merely report on it.
      #
      # This gate was written under a premise that no longer holds: that cairn's
      # source was private and a release carrying the server would be the whole
      # exposure in one artifact. Both cairn and switchboard are MIT and open
      # now, so a binary containing the server discloses nothing.
      #
      # It stays anyway, because secrecy was never what it actually enforced. A
      # cairn archive containing cairnd is a packaging defect on its own terms:
      # it doubles the download, ships a server under a CLI's name to someone
      # who asked for a CLI, and can only happen because a CLI package picked up
      # an import edge into a server package. That edge is the real quarry, and
      # it is just as wrong in an open repo as a closed one. Deleting a working
      # check because its stated justification changed is how the regression it
      # was catching ships quietly.
      #
      # Note the -s -w above: the symbol table is stripped, so a `go tool nm`
      # check here would report "no server symbols" for a binary containing the
      # whole server. The script uses the import graph plus `strings` with a
      # positive control for exactly that reason.
      post:
        - scripts/verify-cli-artifact.sh "{{ .Path }}"

  # The server. Its own build rather than a second binary in the CLI's, so the
  # CLI gate above is untouched and still aborts the release if the cairn
  # binary ever picks up server code.
  #
  # Reproducible on purpose, unlike the CLI build: Harness's manifest pins the
  # cairnd archive by SHA-256, and the release job re-runs against an existing
  # tag with replace_existing_artifacts, so a rebuild that produced different
  # bytes would silently invalidate every pin. -trimpath drops the builder's
  # paths, the commit date replaces the build date in the binary, and
  # mod_timestamp fixes the file mtime the archive records.
  - id: cairnd
    main: ./cmd/cairnd
    binary: cairnd
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.CommitDate}}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: cairn
    ids:
      - cairn
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    # Ship the binary and the licence — nothing else. Left unset, goreleaser's
    # default sweeps README*/CHANGELOG*/LICENSE* from the repo root, and a
    # downloadable tarball then carried this repo's README, whose links point at
    # docs/adrs/, docs/openspec/ and docs/DESIGN.md — dead links for whoever
    # unpacks it, since none of that travels in the archive. The key stays
    # explicitly listed for that reason: omitting it is what re-enables the
    # default, so an empty list and an absent key are not the same thing.
    #
    # LICENSE travels with the binary because a distributed binary should carry
    # its grant rather than leave the recipient guessing. Cairn is MIT, and this
    # is the whole grant — not a subset of one, and not scoped to the client.
    files:
      - LICENSE
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}

  # The server archive. `ids` is what keeps the two apart: an archive with no
  # `ids` takes every build, which is how the CLI archive above would have
  # picked up cairnd the moment the second build existed. Both archives name
  # their build explicitly for that reason.
  #
  # Same files rule as the CLI (binary plus LICENSE, never the README), and the
  # same fixed mtime as the build, so the tarball's bytes are a function of the
  # commit alone.
  - id: cairnd
    ids:
      - cairnd
    formats:
      - tar.gz
    files:
      - src: LICENSE
        info:
          mtime: "{{ .CommitDate }}"
    builds_info:
      mtime: "{{ .CommitDate }}"
    name_template: >-
      cairnd_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}

checksum:
  name_template: 'checksums.txt'

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^ci:'
      - Merge pull request
      - Merge branch

release:
  # Binaries publish to stump-wtf/cairn-cli. goreleaser targeting a repo other
  # than the one it builds from is the point: archives become downloadable
  # without depending on where the source lives.
  #
  # ONE TAG, TWO WRITERS, TWO DESTINATIONS:
  #   * this config, run by the Gitea pipeline -> binaries to cairn-cli, then
  #     the Homebrew tap bump
  #   * .github/workflows/release.yml           -> the ghcr.io image, nothing else
  #
  # That split replaced a real collision. release.yml used to run goreleaser
  # against THIS file, and tags propagate to the mirror, so a single v* tag
  # fired both runners writing identical asset names — with
  # replace_existing_artifacts below turning the collision into a silent
  # overwrite rather than an error. Whichever finished last won, and nothing
  # reported a problem.
  github:
    owner: stump-wtf
    name: cairn-cli
  draft: false
  prerelease: auto
  name_template: "v{{.Version}}"
  # Two kinds of archive sit side by side on every release, and the names differ
  # by one letter, so say which is which before anyone downloads the wrong one.
  header: |
    ## Which download do I want?

    - **`cairn_<version>_<os>_<arch>`**: the **CLI**. It's what you want to share artifacts from a terminal or a script.
    - **`cairnd_<version>_<os>_<arch>`**: the **server**, for running your own Cairn natively (linux and darwin only). Most self-hosters use the container image instead: `ghcr.io/stump-wtf/cairn:{{ .Version }}`.

    Each archive holds its one binary plus `LICENSE`. `checksums.txt` covers both kinds.
  # goreleaser owns the release notes, generated from the changelog block above.
  #
  # This previously carried a different justification: that release.yml created
  # the release first with the matching CHANGELOG.md section as its body, and
  # goreleaser only attached archives to it. That flow was never possible —
  # release.yml runs against stump-wtf/cairn while this config targets
  # stump-wtf/cairn-cli, so the two were never addressing the same release — and
  # release.yml no longer creates one at all.
  #
  # keep-existing stays for a reason that IS real: re-running a tag must not
  # clobber the notes on a release that already exists (see
  # replace_existing_artifacts below, which exists for the same retry path).
  mode: keep-existing
  # Re-running the job against a tag that already carries archives is the
  # normal recovery path (a half-finished upload, a re-run after fixing a
  # secret). goreleaser defaults this to false and errors on the first name
  # collision, which turns every retry into a manual "delete the assets by
  # hand" step.
  replace_existing_artifacts: true
