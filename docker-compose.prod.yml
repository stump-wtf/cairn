# Production / self-host bring-up: cairnd + Postgres + MinIO + Caddy (TLS).
#
#   cp .env.example .env      # then edit the secrets + domain
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Point an A/AAAA record for ${CAIRN_DOMAIN} at this host and open 80/443 so
# Caddy can obtain a Let's Encrypt certificate automatically.
#
# NOTE: this repo's merged code ships a DEV auth stub (any bearer token is
# accepted as its own user id) and no web UI — see DEPLOY.md before exposing it.
name: cairn

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cairn}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-cairn}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cairn}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${CAIRN_S3_ACCESS_KEY:?set CAIRN_S3_ACCESS_KEY in .env}
      MINIO_ROOT_PASSWORD: ${CAIRN_S3_SECRET_KEY:?set CAIRN_S3_SECRET_KEY in .env}
    volumes:
      - miniodata:/data
    restart: unless-stopped
    # Optional: expose the MinIO console on the host only.
    # ports: ["127.0.0.1:9001:9001"]

  cairnd:
    build:
      context: .
      dockerfile: Dockerfile
    image: cairn/cairnd:latest
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        # cairnd creates its bucket on connect and retries via restart policy
        # until MinIO is accepting connections.
        condition: service_started
    environment:
      CAIRN_HTTP_ADDR: ":8080"
      CAIRN_DATABASE_URL: postgres://${POSTGRES_USER:-cairn}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-cairn}?sslmode=disable
      CAIRN_S3_ENDPOINT: minio:9000
      CAIRN_S3_ACCESS_KEY: ${CAIRN_S3_ACCESS_KEY}
      CAIRN_S3_SECRET_KEY: ${CAIRN_S3_SECRET_KEY}
      CAIRN_S3_BUCKET: ${CAIRN_S3_BUCKET:-cairn}
      CAIRN_S3_REGION: ${CAIRN_S3_REGION:-us-east-1}
      CAIRN_S3_USE_SSL: "false"
      CAIRN_BASE_URL: ${CAIRN_BASE_URL:-https://cairn.stump.rocks}
      CAIRN_DEFAULT_TTL: ${CAIRN_DEFAULT_TTL:-168h}
      CAIRN_MAX_UPLOAD_BYTES: ${CAIRN_MAX_UPLOAD_BYTES:-67108864}
      CAIRN_PREVIEW_MAX_BYTES: ${CAIRN_PREVIEW_MAX_BYTES:-5242880}
      CAIRN_RATE_PER_SECOND: ${CAIRN_RATE_PER_SECOND:-20}
      CAIRN_RATE_BURST: ${CAIRN_RATE_BURST:-40}
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    depends_on:
      - cairnd
    ports:
      - "80:80"
      - "443:443"
    environment:
      CAIRN_DOMAIN: ${CAIRN_DOMAIN:-cairn.stump.rocks}
      CAIRN_ACME_EMAIL: ${CAIRN_ACME_EMAIL:-}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    restart: unless-stopped

volumes:
  pgdata:
  miniodata:
  caddydata:
  caddyconfig:
